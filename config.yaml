# ============================================
# IBKR AI Trading Bot — Configuration
# ============================================
# TARGET: +$5/week on $30 capital (15-minute scalping)

# --- Data Sources ---
data:
  price_source: "yahoo"          # "auto" | "alpaca" | "yahoo" — using Yahoo (Alpaca SIP subscription required for penny stocks)
  alpaca_history_years: 2        # How many years of history to request from Alpaca (max practical: ~5)
  cache_expiry_hours: 18         # Re-download if cache is older than this

# --- IBKR Connection ---
ibkr:
  host: "127.0.0.1"
  port: 7497          # 7497 = TWS Paper, 7496 = TWS Live, 4002 = Gateway Paper, 4001 = Gateway Live
  client_id: 1
  account: ""         # Leave empty to auto-detect
  account_type: "cash" # "cash" or "margin" — enforces cash account rules when set to "cash"

# --- Watchlist: High-Beta Momentum Stocks ---
watchlist:
  symbols:
    - PLUG
    - MARA
    - RIOT
    - SOUN
    - LUNR
    - ASTS
    - CLSK
    - SOFI
    - SNDL

# --- Penny Stock Scanner ---
penny_scanner:
  enabled: true
  min_price: 0.50
  max_price: 10.00
  min_avg_volume: 500000
  min_market_cap: 10_000_000    # $10M
  max_market_cap: 500_000_000   # $500M
  exchanges:
    - NYSE
    - NASDAQ
    - AMEX
  top_n_picks: 10
  # Scoring weights (must sum to 1.0)
  weights:
    volume_surge: 0.25
    momentum: 0.20
    technical: 0.20
    sentiment: 0.20
    relative_strength: 0.15

# --- Strategy / ML: 15-Minute Fast Scalper ---
strategy:
  timeframe: "15m"             # 15-minute candles for maximum trade frequency
  lookback_years: 1            # 1 year of training data
  label_horizon_days: 1        # Look for moves within 1 trading day (~26 bars)
  label_threshold_pct: 1.0     # Detect +1.0% intraday breakouts (was 2.5% — too high!)
  label_mode: "atr_relative"   # "fixed" = old static threshold | "atr_relative" = dynamic ATR-based
  label_atr_multiplier: 1.5    # Label BUY when forward return > 1.5 × ATR(14)
  confidence_threshold: 0.42   # Calibrated to model's actual probability distribution (max ~0.52)
  model_type: "xgboost"
  retrain_interval_days: 7     # Retrain weekly for fast-moving penny stocks
  use_sentiment_in_training: false # Prevent lookahead leak: don't broadcast recent news backward across historical bars

# --- Model Ensemble Configuration ---
model:
  ensemble_method: "stacking"    # "single" | "voting" | "stacking"
  base_models:                   # Models used in ensemble (ignored when ensemble_method=single)
    - "xgboost"
    - "lightgbm"
    - "catboost"
  feature_selection: true        # Enable automatic feature pruning
  max_features: 30               # Max features to keep after selection
  feature_selection_mode: "global" # "global" = select once on dataset | "per_fold" = select per fold
  purge_gap_bars: 30             # Gap >= label horizon (~26 bars for 15m) to strictly prevent label leakage
  embargo_bars: 10               # Embargo after test set to prevent look-ahead
  use_sample_weights: true       # Balance class weights to eliminate SELL bias
  use_smote: false               # Disabled: prevents synthetic interpolation distortion on time-series data
  min_probability_gap: 0.12      # Min 12% probability lead over runner-up class to filter indecisive signals
  confidence_percentile: null    # Disabled by default; uses strategy.confidence_threshold (0.55)

# --- Regime Detection ---
regime:
  enabled: true
  volatility_lookback: 50        # Periods to compute volatility percentile rank
  trend_strength_min_adx: 25     # ADX above this = trending market
  high_vol_threshold: 75         # Volatility percentile above this = high regime
  low_vol_threshold: 25          # Volatility percentile below this = low regime

# --- Daily Targets ---
targets:
  daily_profit_target: 5.0       # Daily profit target in dollars
  scale_down_at_pct: 60          # Scale down position sizes at 60% of target ($3)
  stop_trading_at_pct: 120       # Stop trading for the day at 120% of target ($6)

# --- Model Monitoring ---
monitoring:
  enabled: true
  rolling_accuracy_window: 50    # Rolling window for accuracy tracking
  decay_threshold_pct: 10        # Alert if accuracy drops >10% vs training
  auto_retrain: true             # Automatically retrain when accuracy decays
  feature_drift_threshold: 2.0   # Z-score threshold for feature drift detection

# --- Market Session Awareness ---
session:
  avoid_first_minutes: 5         # Avoid trading the first N minutes after market open
  power_hour_start: "15:00"      # Power hour starts at 3:00 PM ET
  power_hour_boost: 1.2          # Increase position size by 20% during power hour
  midday_penalty: 0.7            # Reduce position size by 30% during 11:30-14:30 (low vol)

# --- Risk Management: Tight Scalp Parameters ---
risk:
  max_risk_per_trade_pct: 3.0  # Risk 3% of capital per trade
  max_position_pct: 35.0       # 35% max per position (cash account: leaves room for settlement rotation)
  max_daily_loss_pct: 8.0      # Daily drawdown kill-switch
  max_open_positions: 3        # Focus on top 3 setups
  stop_loss_atr_mult: 2.0      # Wider 2.0x ATR stop-loss — give penny stocks more room (was 1.5)
  take_profit_atr_mult: 3.0    # Wider 3.0x ATR profit target — let winners run (was 2.5)
  trailing_stop_pct: 1.5       # Trail 1.5% below high watermark (lock profits fast)
  # Cash account settlement rules
  settlement_days: 1           # T+1 settlement for US stocks (since May 2024)
  max_day_trades_per_5d: 3     # Max round-trip day trades per 5 business days (safety limit)
  # Adaptive stop-loss by regime
  regime_stops:
    trending:
      stop_loss_atr_mult: 1.2   # Tighter stop in trends, let profits run
      take_profit_atr_mult: 3.5  # Wider target in trends
    ranging:
      stop_loss_atr_mult: 2.5   # Wider stop in ranges, avoid whipsaws
      take_profit_atr_mult: 1.8  # Tighter target in ranges (mean-revert)
    volatile:
      stop_loss_atr_mult: 2.0   # Moderate stop in volatile regimes
      take_profit_atr_mult: 2.5  # Moderate target
  # Time-based stop
  time_stop_bars: 26             # Close position if no movement after 26 bars (~1 trading day for 15m)
  time_stop_min_move_pct: 0.3    # Minimum move required to keep position open
  # Correlation-based exposure
  max_correlation: 0.70          # Max correlation allowed between simultaneous positions

# --- Sentiment / News ---
sentiment:
  provider: "newsapi"          # newsapi or scraper
  model: "ProsusAI/finbert"    # HuggingFace model for sentiment
  lookback_days: 7             # How many days of news to fetch
  min_articles: 2              # Minimum articles required for a valid sentiment score

# --- Backtesting ---
backtest:
  initial_capital: 30.0        # Match your actual capital
  commission_per_share: 0.005  # IBKR tiered rate
  slippage_pct: 0.05           # 5 basis points slippage estimate
  enable_shorts: false         # Disabled — cash accounts cannot short sell
  monte_carlo_iterations: 1000 # Number of Monte Carlo shuffles
  monte_carlo_confidence: 0.95 # Confidence level for Monte Carlo intervals

# --- Logging ---
logging:
  level: "INFO"
  trade_log_file: "logs/trades.csv"
  report_dir: "reports/"
